name: Prepare R3 Debug mini-app refresh (review branch only)

# One-shot QA preview; NO Stable publication or main push from this job.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prepare-debug-r3-one-shot.yml
  push:
    branches:
      - feat/debug-r3-labs-refresh-20261108
    paths:
      - .github/workflows/prepare-debug-r3-one-shot.yml

permissions:
  contents: write

concurrency:
  group: debug-r3-qa-preview
  cancel-in-progress: false

jobs:
  pack-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mini-app catalog QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout exact reviewed Chappy Player source
        uses: actions/checkout@v4
        with:
          repository: mibesamiti-png/chappy-player
          ref: 6753d533df29b54c70d592d2f65914d85e3e0615
          path: upstream
          persist-credentials: false
      - name: Test source contracts before public packaging
        working-directory: upstream
        run: |
          python3 tools/test_debug_sample_library.py
          python3 tools/test_chappy_package_tools.py
          node tools/test_device_lab.js
          node tools/test_file_lab.js
          node tools/test_game_server_lab.js
      - name: Generate only three higher-version Debug labs and validate all catalog bytes
        run: python3 scripts/refresh_debug_r3.py upstream
      - name: Stage exact three new immutable packages and catalog metadata
        run: |
          test "$GITHUB_REF_NAME" = "feat/debug-r3-labs-refresh-20261108"
          test -f debug/chappy-device-lab-v0.2.1.chappy
          test -f debug/chappy-file-lab-v0.2.3.chappy
          test -f debug/chappy-game-server-lab-v0.1.2.chappy
          if git diff --name-only | grep '^stable/'; then
            echo 'Refusing any Stable artifact change'
            exit 1
          fi
          git add catalog.json \
            debug/chappy-device-lab-v0.2.1.chappy \
            debug/chappy-file-lab-v0.2.3.chappy \
            debug/chappy-game-server-lab-v0.1.2.chappy
          git diff --cached --stat
          git diff --cached --quiet && { echo 'Nothing to publish'; exit 1; }
      - name: Commit verified Debug package files and catalog atomically to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage immutable R3 Debug Lab packages for public catalog review'
          git push origin HEAD:feat/debug-r3-labs-refresh-20261108
