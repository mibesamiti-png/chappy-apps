name: Validate public Chappy Apps catalog

on:
  pull_request:
    paths:
      - catalog.json
      - "stable/**"
      - "debug/**"
      - scripts/validate_catalog.py
      - .github/workflows/validate-catalog.yml
      - .github/workflows/promote-recorder-stable.yml
  push:
    branches: [main]
    paths:
      - catalog.json
      - "stable/**"
      - "debug/**"
      - scripts/validate_catalog.py
      - .github/workflows/validate-catalog.yml
      - .github/workflows/promote-recorder-stable.yml

permissions:
  contents: read

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify every catalog package SHA-256, size and manifest
        run: python3 scripts/validate_catalog.py
