name: Prepare reviewed Debug Lab catalog preview

# This branch-only one-shot workflow generates actual .chappy packages.
# It never publishes to main: only a subsequently reviewed PR can do that.
on:
  push:
    branches:
      - feat/catalog-debug-labs-20261107
    paths:
      - .github/workflows/prepare-debug-labs.yml

permissions:
  contents: write

concurrency:
  group: prepare-reviewed-debug-labs
  cancel-in-progress: false

jobs:
  bundle-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public Chappy Apps (feature branch)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout reviewed Chappy Player source at tested commit
        uses: actions/checkout@v4
        with:
          repository: mibesamiti-png/chappy-player
          ref: 0d838b79b3dcd0ee391d14ebcbe0d63f5938d4ca
          path: upstream
          persist-credentials: false
      - name: Verify published demo source and package constraints
        working-directory: upstream
        run: |
          python3 tools/test_debug_sample_library.py
          python3 tools/test_chappy_package_tools.py
          node tools/test_chappy_recorder.js
          node tools/test_device_lab.js
          node tools/test_file_lab.js
          node tools/test_game_server_lab.js
      - name: Generate seven new Debug .chappy and verify all catalog entries
        run: python3 scripts/publish_debug_labs.py upstream
      - name: Ensure no Stable catalog artifacts changed
        run: |
          if git diff --name-only | grep '^stable/'; then
            echo 'Stable assets changed unexpectedly'
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "feat/catalog-debug-labs-20261107" ]; then
            echo 'Refusing catalog preview update outside dedicated branch'
            exit 1
          fi
      - name: Commit verified packages and catalog together to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json debug/memo-v0.1.0.chappy \
            debug/chappy-recorder-v0.1.3.chappy \
            debug/chappy-device-lab-v0.2.0.chappy \
            debug/chappy-file-lab-v0.2.2.chappy \
            debug/chappy-game-server-lab-v0.1.0.chappy \
            debug/chappy-touch-lab-v0.1.0.chappy \
            debug/chappy-color-lab-v0.1.0.chappy
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No changes to Debug catalog'
            exit 0
          fi
          git commit -m 'Add seven verified mini-apps to public Debug catalog'
          git push origin HEAD:feat/catalog-debug-labs-20261107
